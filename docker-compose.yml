version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: food-delivery-postgres
    environment:
      POSTGRES_DB: food_delivery
      POSTGRES_USER: food_user
      POSTGRES_PASSWORD: food_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_user -d food_delivery"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: food-delivery-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
      MONGO_INITDB_DATABASE: food_delivery
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./infrastructure/mongodb/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: food-delivery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: food-delivery-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_password
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kafka (Alternative Message Broker)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: food-delivery-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - food-delivery-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: food-delivery-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - food-delivery-network

  # Analytics Service (Real-time GPS tracking and analytics)
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: food-delivery-analytics-service
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: development
      PORT: 3008
      DATABASE_URL: postgresql://food_user:food_password@postgres:5432/food_delivery
      MONGODB_URL: mongodb://admin:admin_password@mongodb:27017/food_delivery
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin_password@rabbitmq:5672
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-network
    volumes:
      - ./services/analytics-service:/app
      - /app/node_modules

  # Microservices
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: food-delivery-auth-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://food_user:food_password@postgres:5432/food_delivery
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin_password@rabbitmq:5672
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-network
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules



  restaurant-service:
    build:
      context: ./services/restaurant-service
      dockerfile: Dockerfile
    container_name: food-delivery-restaurant-service
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://food_user:food_password@postgres:5432/food_delivery
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin_password@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-network
    volumes:
      - ./services/restaurant-service:/app
      - /app/node_modules

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: food-delivery-order-service
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: postgresql://food_user:food_password@postgres:5432/food_delivery
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin_password@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-network
    volumes:
      - ./services/order-service:/app
      - /app/node_modules

  delivery-service:
    build:
      context: ./services/delivery-service
      dockerfile: Dockerfile
    container_name: food-delivery-delivery-service
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: development
      PORT: 3005
      DATABASE_URL: postgresql://food_user:food_password@postgres:5432/food_delivery
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin_password@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-network
    volumes:
      - ./services/delivery-service:/app
      - /app/node_modules

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: food-delivery-notification-service
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: development
      PORT: 3006
      DATABASE_URL: postgresql://food_user:food_password@postgres:5432/food_delivery
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin_password@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-network
    volumes:
      - ./services/notification-service:/app
      - /app/node_modules

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: food-delivery-payment-service
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: development
      PORT: 3007
      DATABASE_URL: postgresql://food_user:food_password@postgres:5432/food_delivery
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin_password@rabbitmq:5672
      ORDER_SERVICE_URL: http://order-service:3004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-network
    volumes:
      - ./services/payment-service:/app
      - /app/node_modules

  # API Gateway
  api-gateway:
    image: node:18-alpine
    container_name: food-delivery-api-gateway
    working_dir: /app
    volumes:
      - ./services/api-gateway:/app
      - /app/node_modules
    command: sh -c "npm install && npm run start:dev"
    environment:
      NODE_ENV: development
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001

      RESTAURANT_SERVICE_URL: http://restaurant-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      DELIVERY_SERVICE_URL: http://delivery-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      PAYMENT_SERVICE_URL: http://payment-service:3007
      ANALYTICS_SERVICE_URL: http://analytics-service:3008
    ports:
      - "3000:3000"
    networks:
      - food-delivery-network
    depends_on:
      - auth-service

      - restaurant-service
      - order-service
      - delivery-service
      - notification-service
      - payment-service
      - analytics-service



volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:

networks:
  food-delivery-network:
    driver: bridge
